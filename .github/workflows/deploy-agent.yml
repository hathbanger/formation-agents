# .github/workflows/deploy-agent.yml
#
# Deploy agent Docker image to DigitalOcean App Platform
# (Skips build step since containers are already pushed to registry)
#
# Required secrets:
#   - DOCR_TOKEN: DigitalOcean Container Registry token
#   - PLATFORM_API_KEY: API key for notifying the Formation platform
#   - DO_APP_ID: DigitalOcean App Platform App ID
#   - SUPABASE_SERVICE_KEY: Supabase service key for updating status
#
# Required inputs:
#   - deployment_id: Deployment record ID (from Formation platform)
#   - agent_id: Agent ID
#   - docker_tag: Existing Docker image tag to deploy

name: Deploy Agent to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Deployment record ID"
        required: true
      agent_id:
        description: "Agent ID"
        required: true
      app_id:
        description: "DigitalOcean App Platform App ID"
        required: true
      docker_tag:
        description: "Docker image tag to deploy (must already exist in registry)"
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: registry.digitalocean.com/formation-registry/${{ github.event.inputs.docker_tag }}
      DEPLOYMENT_ID: ${{ github.event.inputs.deployment_id }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
    steps:
      - uses: actions/checkout@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DOCR_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Create .do directory if it doesn't exist
        run: mkdir -p .do

      - name: Generate app.yaml from template
        run: |
          # Truncate agent_id to make sure service name is under 32 chars
          SHORT_ID="${{ github.event.inputs.agent_id }}"
          SHORT_ID="${SHORT_ID:0:5}"

          cat > .do/app.yaml << EOF
          name: agent-app
          services:
            - name: agent-svc-${SHORT_ID}
              image:
                registry_type: DOCR
                repository: ${{ github.event.inputs.app_id }}
                tag: latest
              envs:
                - key: AGENT_SCRIPT_NAME
                  value: ${{ github.event.inputs.app_id }}.py
                - key: API_PORT
                  value: "8000"
              http_port: 8000
              routes:
                - path: /
                  preserve_path_prefix: true
              instance_count: 1
              instance_size_slug: basic-xxs
          EOF

          # Show generated file for debugging
          echo "Generated app.yaml:"
          cat .do/app.yaml

      - name: Deploy to DigitalOcean App Platform
        uses: digitalocean/app_action/deploy@v2
        with:
          token: ${{ secrets.DOCR_TOKEN }}

      - name: Update deployment status in Supabase
        run: |
          curl -X PATCH "https://pdvykxnxguorkqrrpugq.supabase.co/rest/v1/deployments?id=eq.${{ github.event.inputs.deployment_id }}" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{"status": "deployed", "docker_image": "${{ github.event.inputs.docker_tag }}"}'
